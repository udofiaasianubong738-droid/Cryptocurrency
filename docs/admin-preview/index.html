.content{max-width:1600px;margin:auto;padding:27px 32px 30px}.preview-alert{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding:12px 15px;border:1px solid #625126;border-radius:13px;background:#211d12;color:#e7d59a}.alert-icon{display:grid;place-items:center;width:27px;height:27px;flex:none;border-radius:8px;background:#4a3b17;color:#f1d98a}.preview-alert strong{display:block;font-size:10px}.preview-alert p{margin:4px 0 0;color:#b5a77b;font-size:9px;line-height:1.5}.alert-tag{margin-left:auto;white-space:nowrap;font-size:8px;letter-spacing:1px;font-weight:800}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 20px}.eyebrow{margin:0 0 7px;color:var(--gold2);font-size:9px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}.heading h1{margin:0;font-size:clamp(24px,3vw,34px);letter-spacing:-1.1px}.heading p{margin:7px 0 0;color:var(--muted);font-size:11px;line-height:1.6}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:37px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#1b1e21;color:#e9e6dd;font-size:10px;font-weight:700}.btn:hover{border-color:#90752c;color:var(--gold2)}.btn.gold{border-color:#c9a227;background:linear-gradient(135deg,#d6b64d,#a17e1e);color:#17140a}.btn.gold:hover{filter:brightness(1.08)}.btn.ghost{background:transparent}
.grid{display:grid;gap:15px}.grid.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{min-width:0;padding:18px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,#171a1d,#121416);box-shadow:0 12px 35px #00000018}.metric-label{display:flex;align-items:center;justify-content:space-between;color:#a9a9a5;font-size:10px}.metric-icon{display:grid;place-items:center;width:30px;height:30px;border:1px solid #6e5a2466;border-radius:9px;background:#c9a22713;color:var(--gold2)}.metric-value{margin:15px 0 6px;color:#f5f0e2;font-size:25px;font-weight:700;letter-spacing:-1px}.metric-note{color:#8b8e92;font-size:9px;line-height:1.5}.status-text{display:inline-flex;align-items:center;gap:6px;color:#c5ad64;font-size:9px}.dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}.cols{grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);margin-bottom:15px}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}.card-head h2{margin:0;font-size:14px;letter-spacing:-.3px}.card-head p{margin:5px 0 0;color:var(--muted);font-size:9px}.muted{color:var(--muted)}.empty{display:grid;place-items:center;min-height:160px;padding:20px;text-align:center;border:1px dashed #393b3e;border-radius:13px;background:#111315}.empty-symbol{display:grid;place-items:center;width:40px;height:40px;margin-bottom:10px;border:1px solid #75612666;border-radius:13px;background:#c9a22712;color:var(--gold2);font-size:18px}.empty strong{font-size:10px}.empty p{max-width:360px;margin:6px 0;color:#92959a;font-size:9px;line-height:1.7}.empty small{color:#777b80;font-size:8px}.chart-placeholder{position:relative;display:grid;place-items:center;min-height:195px;overflow:hidden;border:1px solid #292d32;border-radius:12px;background:repeating-linear-gradient(to bottom,#171a1d 0,#171a1d 47px,#24282c 48px)}.chart-label{padding:12px 16px;border:1px solid #393b3e;border-radius:11px;background:#141619ed;text-align:center}.chart-label strong{display:block;font-size:10px}.chart-label span{display:block;margin-top:5px;color:var(--muted);font-size:8px}.feed-list{display:grid;gap:9px}.feed-row{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:11px;background:#121518}.feed-row span{color:var(--gold2)}.feed-row p{margin:0;color:#a9a9a5;font-size:9px;line-height:1.5}.feed-row b{display:block;color:#eee9dd;font-size:9px}.bottom-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.page-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;font-size:9px}.table th{background:#191c20;color:#9a9da1;font-weight:700}.table td{color:#bfc0bc}.table tr:last-child td{border-bottom:0}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:14px}.toolbar input,.toolbar select{min-height:36px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#171a1d;color:var(--text);font-size:10px}.info-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:10px}.info-row:last-child{border-bottom:0}.info-row span{color:var(--muted)}.info-row strong{font-size:10px;text-align:right}.pill{display:inline-flex;padding:5px 8px;border:1px solid #625126;border-radius:7px;background:#2a2414;color:#e0c66f;font-size:8px;font-weight:700}.note{padding:12px;border:1px solid #625126;border-radius:11px;background:#211d12;color:#d5c48f;font-size:9px;line-height:1.65}.actions-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.feature-list{display:grid;gap:9px}.feature{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#121518}.feature i{color:var(--gold2);font-style:n .footer{display:flex;justify-content:space-between;gap:12px;padding:20px 2px 0;color:#74787d;font-size:8px}.login-screen{display:grid;place-items:center;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 50% 10%,#5c481a44,transparent 45%),#0b0c0e}.login-card{width:min(440px,100%);padding:32px;border:1px solid #4b4024;border-radius:22px;background:#141619;box-shadow:0 25px 90px #0008}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:35px}.login-card h1{margin:0;font-size:27px}.login-card>p{margin:9px 0 23px;color:var(--muted);font-size:11px;line-height:1.7}.login-foot{margin-top:20px;color:#888b8f;font-size:8px;line-height:1.6}.modal-backdrop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:#000b}.modal{width:min(430px,100%);padding:22px;border:1px solid #554724;border-radius:17px;background:#171a1d;box-shadow:0 20px 80px #000a}.modal h2{margin:0 0 8px;font-size:16px}.modal p{margin:0;color:var(--muted);font-size:10px;line-height:1.7}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:20px;bottom:20px;z-index:40;max-width:min(390px,calc(100% - 40px));padding:13px 16px;border:1px solid #6d5b2b;border-radius:11px;background:#211d12;color:#ead99f;font-size:10px;line-height:1.6;box-shadow:0 12px 40px #0008}
@media(max-width:1100px){.grid.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}}
@media(max-width:780px){.sidebar{display:none}.main{margin-left:0}.topbar{height:62px;padding:0 15px}.mobile-toggle{display:grid}.user-chip{display:none}.search{width:min(45vw,230px)}.content{padding:18px 15px 25px}.heading{align-items:flex-start;flex-direction:column}.page-grid,.bottom-grid{grid-template-columns:1fr}.preview-alert{align-items:flex-start}.alert-tag{display:none}.nav-drawer{position:fixed;inset:62px 0 auto;z-index:20;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:12px;border-bottom:1px solid var(--line);background:#101214;box-shadow:0 12px 25px #0007}.nav-drawer a{padding:10px;border:1px solid var(--line);border-radius:9px;color:#ccc;font-size:10px}.nav-drawer a.active{border-color:#806b2b;color:var(--gold2)}}
@media(max-width:460px){.grid.metrics{gap:9px}.card{padding:14px}.metric-value{font-size:21px}.metric-label{font-size:9px}.top-actions{gap:6px}.search{width:42vw;padding:8px}.footer{flex-direction:column}.login-card{padding:24px}}

<body>
<div id="app"></div>
<script>
(function(){
const nav=[
 {id:"dashboard",label:"Overview",icon:"◈",group:"WORKSPACE",desc:"A live-data workspace with honest connection states."},
 {id:"customers",label:"Customers",icon:"♙",group:"WORKSPACE",desc:"Customer directory and authorised account profiles."},
 {id:"investment-records",label:"Investment records",icon:"▤",group:"WORKSPACE",desc:"Read-only investment records and their verified history."},
 {id:"performance",label:"Performance reports",icon:"⌁",group:"INSIGHTS",desc:"Reports calculated only from verified backend records."},
 {id:"documents",label:"Record documents",icon:"▧",group:"WORKSPACE",desc:"Customer-linked documents and their access history."},
 {id:"notifications",label:"Notifications",icon:"♧",group:"COMMUNICATIONS",desc:"Notification history and delivery state."},
 {id:"ai-operations",label:"AI operations centre",icon:"✧",group:"INTELLIGENCE",desc:"Human-reviewed data quality and system observations."},
 {id:"ceo-verification",label:"CEO verification",icon:"⌑",group:"CONTROLS",desc:"Illustrative CEO identity and MFA checkpoint; no codes are collected here."},
 {id:"security",label:"Security centre",icon:"⬡",group:"CONTROLS",desc:"Identity, session, role and security verification."},
 {id:"profile",label:"Admin profile",icon:"♙",group:"CONTROLS",desc:"Administrator profile and session information."},
 {id:"system-status",label:"System status",icon:"◉",group:"CONTROLS",desc:"Backend, hosting and build readiness status."},
 {id:"audit",label:"Audit logs",icon:"◷",group:"CONTROLS",desc:"Append-only history of privileged administrative activity."},
 {id:"settings",label:"Settings",icon:"⚙",group:"CONTROLS",desc:"Workspace preferences and backend configuration status."},
 {id:"support",label:"Help and support",icon:"?",group:"SUPPORT",desc:"Help resources and support contact information."}
];
let current="login",drawer=false,search="",toastTimer;
const app=document.getElementById("app");
const logo='<svg class="brand-mark" viewBox="0 0 52 52" role="img" aria-label="CryptoInvest shield growth logo"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3dc87"/><stop offset="1" stop-color="#a77c18"/></linearGradient></defs><path d="M26 3 44 10v14c0 12-7 20-18 25C15 44 8 36 8 24V10L26 3Z" fill="#17150e" stroke="url(#g)" stroke-width="2.4"/><path d="M15 33V27m8 6V21m8 12V17" stroke="url(#g)" stroke-width="3.1" stroke-linecap="round"/><path d="m14 22 9-5 7 3 9-10m-7 0h7v7" fill="none" stroke="url(#g)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const brand='<span class="brand">'+logo+'<span><span class="brand-name">Crypto<span>Invest</span></span><small class="brand-sub">Admin workspace</small></span></span>';
function toast(msg){let t=document.querySelector(".toast");if(t)t.remove();t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),4200)}
function setRoute(id){current=id;drawer=false;if(location.hash!=="#"+id){location.hash=id}else{render()}window.scrollTo(0,0)}
function modal(title,body){const d=document.createElement("div");d.className="modal-backdrop";d.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title"></h2><p></p><div class="modal-actions"><button class="btn" data-close>Close</button></div></section>';d.querySelector("h2").textContent=title;d.querySelector("p").textContent=body;d.addEventListener("click",e=>{if(e.target===d||e.target.closest("[data-close]"))d.remove()});document.body.appendChild(d);d.querySelector("button").focus()}
function alertbar(){return '<div class="preview-alert"><span class="alert-icon">!</span><div><strong>Public design preview — backend records are not connected here</strong><p>This GitHub Pages site contains no customer data, account credentials or live financial controls. Real values will appear only after authenticated, server-authorised read connections are verified.</p></div><span class="alert-tag">PREVIEW ONLY</span></div>'}
function empty(title,detail){return '<div class="empty"><span class="empty-symbol">◇</span><strong>'+title+'</strong><p>'+detail+'</p><small>No sample records or invented totals are displayed.</small></div>'}
function card(title,sub,body){return '<section class="card"><div class="card-head"><div><h2>'+title+'</h2><p>'+sub+'</p></div></div>'+body+'</section>'}
function pageHead(id){const s=nav.find(x=>x.id===id);return '<div class="heading"><div><p class="eyebrow">'+s.group+'</p><h1>'+s.label+'</h1><p>'+s.desc+'</p></div><button class="btn" data-action="refresh">↻ Check connection</button></div>'}
function table(columns){return '<div class="table-wrap"><table class="table"><thead><tr>'+columns.map(c=>'<th>'+c+'</th>').join("")+'</tr></thead><tbody><tr><td colspan="'+columns.length+'" style="text-align:center;padding:26px;color:#85898e">Waiting for authenticated backend records</td></tr></tbody></table></div>'}
function dashboard(){return '<div class="heading"><div><p class="eyebrow">ADMIN PREVIEW WORKSPACE</p><h1>Admin overview</h1><p>Platform visibility, verified records and system readiness.</p></div><button class="btn" data-action="refresh">↻ Refresh status</button></div><div class="grid metrics">'+[['Customer accounts','Awaiting data','People directory'],['Investment records','Awaiting data','Verified record source'],['Pending reviews','Awaiting data','Authorised review queue'],['System health','Unverified','Live service checks']].map((m,i)=>'<article class="card"><div class="metric-label"><span>'+m[0]+'</span><span class="metric-icon">'+['♙','▤','◷','⬡'][i]+'</span></div><div class="metric-value">—</div><div class="metric-note">'+m[1]+' · '+m[2]+'</div></article>').join("")+'</div><div class="grid cols">'+card('Platform activity','Verified backend event stream only','<div class="chart-placeholder"><div class="chart-label"><strong>Awaiting verified data</strong><span>No sample chart or synthetic activity is shown.</span></div></div>')+card('Recent activity','Audit-backed administrative events',empty('No activity loaded','Connect the authenticated audit read endpoint to display events.'))+'</div><div class="grid bottom-grid">'+card('Customer overview','Private customer records',empty('Customer source not connected','Customer data will appear only after CEO authentication and server-side authorisation.'))+card('Investment records','Read-only record view',empty('No records loaded','Verified investment records will appear here when the secure read endpoint is available.'))+card('Security posture','Current session and policy checks','<div class="info-row"><span>CEO authorisation</span><b class="pill">Requires live check</b></div><div class="info-row"><span>MFA / AAL2</span><b class="pill">Requires live check</b></div><div class="info-row"><span>Financial operations</span><b class="pill">Disabled</b></div>')+'</div>'}
function content(id){
 if(id==="dashboard")return dashboard();
 if(id==="customers")return '<div class="grid page-grid">'+card('Customer directory','Search and inspect authorised customer profiles','<div class="toolbar"><span class="pill">Read-only</span><span class="muted">Search and filters activate after the protected customer data source is connected.</span></div>'+empty('Customer data unavailable','The authenticated CEO customer-list endpoint is not configured for this public preview. No names or emails are fabricated.'))+card('Customer profile','Private customer information','<div class="feature-list"><div class="feature"><i>◈</i><div><strong>Ownership boundary</strong><small>Each profile must be retrieved through server-side CEO authorisation.</small></div></div><div class="feature"><i>⬡</i><div><strong>Access history</strong><small>Profile access must be auditable and scoped to the permitted administrator.</small></div></div></div>')+'</div>';
 if(id==="investment-records")return '<div class="grid page-grid">'+card('Investment register','Authoritative customer-linked records',table(['Record reference','Customer reference','Plan','Status','Updated']))+card('Record detail','History and provenance',empty('Select a verified record','Record detail and history will load only from the protected backend.'))+card('Performance entries','Recorded outcomes, not projections',table(['Effective date','Record type','Value source','Review status']))+card('Record controls','Display-only prototype','<div class="note">This interface does not create or approve financial records. Record changes must remain behind verified, audited server-side controls.</div>')+'</div>';
 if(id==="performance")return '<div class="grid page-grid">'+card('Performance summary','Calculated from verified record history',empty('No verified performance data','No profit, loss, return or balance figures are shown without a trusted source and calculation contract.'))+card('Performance timeline','Historical data only','<div class="chart-placeholder"><div class="chart-label"><strong>Chart unavailable</strong><span>Waiting for verified reporting data.</span></div></div>')+card('Report filters','Reporting controls','<div class="toolbar"><label class="muted">From <input type="date" aria-label="Report start date"></label><label class="muted">To <input type="date" aria-label="Report end date"></label><button class="btn" data-action="filter-report">Apply filters</button></div><p class="muted">Filters are staged locally in this preview. No report query is sent.</p>')+card('Export','Download report','<div class="note">An export will be enabled only when a verified report result is available. This preview has no report dataset to export.</div>')+'</div>';
 if(id==="documents")return '<div class="grid page-grid">'+card('Document library','Authorised customer and compliance documents',table(['Document','Linked record','Type','Status','Updated']))+card('Document access','Protected storage status',empty('Storage source not connected','Private document metadata and signed links require verified access policies.'))+'</div>';
 if(id==="notifications")return '<div class="grid page-grid">'+card('Notification history','System-created notification records',table(['Notification','Recipient reference','Category','Delivery state','Created']))+card('Delivery status','Provider-confirmed status only',empty('No notification events loaded','No messages are sent from this preview. Delivery states must come from the backend provider record.'))+'</div>';
 if(id==="ai-operations")return '<div class="grid page-grid">'+card('AI findings','Human-reviewed observations',empty('No findings loaded','The admin AI findings endpoint is not connected to this static preview.'))+card('Review principles','Human oversight required','<div class="feature-list"><div class="feature"><i>✓</i><div><strong>Explain, do not execute</strong><small>AI can summarise system conditions and data-quality findings.</small></div></div><div class="feature"><i>✓</i><div><strong>Human review</strong><small>Any proposed administrative change requires authorised human review.</small></div></div><div class="feature"><i>✓</i><div><strong>No financial actions</strong><small>AI cannot initiate transfers, payouts, deposits, withdrawals or trades.</small></div></div></div>')+'</div>';
  if(id==="ceo-verification")return '<div class="grid page-grid">'+card('CEO identity checkpoint','Secure login sequence','<div class="info-row"><span>Authenticated identity</span><b class="pill">Not verified on this public host</b></div><div class="info-row"><span>CEO allowlist</span><b class="pill">Server verification required</b></div><div class="info-row"><span>Authenticator MFA</span><b class="pill">AAL2 required</b></div><div class="note">This is an explanatory preview only. Never enter a password, authenticator code or recovery key on this public static page.</div><div class="actions-row"><button class="btn" data-action="login-return">Return to preview entry</button></div>')+card('Access decision','Server-enforced checks',empty('No administrator session','The protected application must validate the user, CEO authorization and AAL2 before granting access.'))+'</div>';
if(id==="profile")return '<div class="grid page-grid">'+card("Administrator profile","Authenticated account details",empty("Profile not loaded","A protected profile endpoint must supply the administrator details after CEO authentication."))+card("Session management","Active sessions and security events",empty("No session on this host","Session details are private and must come from the authenticated server-side session."))+"</div>";
if(id==="system-status")return '<div class="grid page-grid">'+card("Service readiness","Verified health checks only",'<div class="info-row"><span>Supabase</span><b class="pill">Not checked here</b></div><div class="info-row"><span>Cloudflare</span><b class="pill">Not checked here</b></div><div class="info-row"><span>Admin API</span><b class="pill">Not connected</b></div><div class="info-row"><span>GitHub Pages</span><b class="pill">Static preview</b></div>')+card("Build and safety gates","Readiness conditions",empty("Verification pending","Only actual build, authorization and backend health checks can establish readiness."))+"</div>";
if(id==="security")return '<div class="grid page-grid">'+card('Identity and access','Live session and policy verification','<div class="info-row"><span>Administrator identity</span><b class="pill">Not verified in preview</b></div><div class="info-row"><span>CEO allowlist</span><b class="pill">Server check required</b></div><div class="info-row"><span>MFA / AAL2</span><b class="pill">Server check required</b></div><div class="info-row"><span>Customer/admin separation</span><b class="pill">Backend policy review required</b></div>')+card('Financial safety gate','Non-negotiable system restriction','<div class="note">financial_operations_enabled = false<br>Live money movement and transaction execution remain disabled.</div><div class="actions-row"><button class="btn" data-action="security-detail">View security requirements</button></div>')+card('Session controls','Protected authentication session',empty('No session on this host','This public preview does not authenticate administrators or create Supabase sessions.'))+'</div>';
 if(id==="audit")return '<div class="grid page-grid">'+card('Administrative audit trail','Protected, append-only event source',table(['Timestamp','Actor reference','Event','Target reference','Outcome']))+card('Audit integrity','Read-only review',empty('Audit source not connected','Audit data must be loaded from the protected audit endpoint and must not be editable here.'))+'</div>';
 if(id==="settings")return '<div class="grid page-grid">'+card('Workspace identity','Brand and application information','<div class="info-row"><span>Platform</span><strong>CryptoInvest</strong></div><div class="info-row"><span>Workspace</span><strong>Administrator preview</strong></div><div class="info-row"><span>Theme</span><strong>Black · Gold · Ivory</strong></div><div class="info-row"><span>Hosting</span><strong>GitHub Pages preview</strong></div>')+card('Backend connections','Connection state from verified checks only','<div class="info-row"><span>Supabase project</span><b class="pill">Not connected on this host</b></div><div class="info-row"><span>Cloudflare Worker</span><b class="pill">Not checked by preview</b></div><div class="info-row"><span>Admin API</span><b class="pill">Awaiting secure integration</b></div>')+card('Security configuration','Managed on the protected backend','<div class="note">This public prototype cannot change authentication settings, secrets, database policies, DNS or deployment configuration.</div>')+'</div>';
 return '<div class="grid page-grid">'+card('Help centre','Administrator guidance',empty('Help articles not connected','Approved administrator documentation can be linked here.'))+card('Support','Support information','<div class="feature-list"><div class="feature"><i>✉</i><div><strong>Support contact</strong><small>Support contact details must be confirmed before publishing.</small></div></div><div class="feature"><i>◷</i><div><strong>Support history</strong><small>Support records require authenticated backend access.</small></div></div></div><div class="actions-row"><button class="btn" data-action="support">View support information</button></div>')+'</div>';
}
function shell(){
 const filtered=nav.filter(n=>n.label.toLowerCase().includes(search.toLowerCase()));
 const grouped=["WORKSPACE","INSIGHTS","COMMUNICATIONS","INTELLIGENCE","CONTROLS","SUPPORT"];
 const links=grouped.map(g=>{const items=filtered.filter(n=>n.group===g);return items.length?'<div class="nav-caption">'+g+'</div>'+items.map(n=>'<a href="#'+n.id+'" data-route="'+n.id+'" class="'+(current===n.id?'active':'')+'"><span class="nav-icon">'+n.icon+'</span>'+n.label+'</a>').join(""):""}).join("");
 return '<div class="shell"><aside class="sidebar"><a href="#dashboard" aria-label="CryptoInvest overview">'+brand+'</a><div class="nav-caption">ADMIN MENU</div><nav class="nav" aria-label="Administrator navigation">'+links+'</nav><div class="sidebar-bottom"><div class="safety-mini"><strong>◈ Safety gate active</strong><p>Financial operations remain disabled. This preview cannot change that setting.</p></div><div class="side-foot">CryptoInvest · Admin Preview</div></div></aside><main class="main"><header class="topbar"><div class="crumb"><b>CryptoInvest</b> &nbsp;/&nbsp; '+(nav.find(n=>n.id===current)?.label||"Overview")+'</div><div class="top-actions"><label class="search"><span>⌕</span><input id="nav-search" type="search" placeholder="Find a screen…" value="'+escapeHtml(search)+'" aria-label="Search navigation"></label><button class="icon-btn" data-action="notifications" aria-label="Notification information">♧</button><div class="user-chip"><span class="avatar">CI</span><span><strong>Preview workspace</strong><small>Not authenticated</small></span></div><button class="icon-btn" data-action="exit" aria-label="Exit preview">↪</button><button class="mobile-toggle" data-action="menu" aria-label="Toggle navigation">☰</button></div></header>'+(drawer?'<nav class="nav-drawer" aria-label="Mobile administrator navigation">'+nav.map(n=>'<a href="#'+n.id+'" data-route="'+n.id+'" class="'+(current===n.id?'active':'')+'">'+n.icon+' &nbsp;'+n.label+'</a>').join("")+'</nav>':"")+'<div class="content">'+alertbar()+(current==="dashboard"?content("dashboard"):pageHead(current)+content(current))+'<footer class="footer"><span>© '+new Date().getFullYear()+' CryptoInvest</span><span>Static design preview · no live financial functions</span></footer></div></main></div>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function login(){return '<main class="login-screen"><section class="login-card"><div class="login-brand">'+logo+'<span><span class="brand-name">Crypto<span>Invest</span></span><small class="brand-sub">ADMINISTRATOR</small></span></div><p class="eyebrow">SECURE WORKSPACE PREVIEW</p><h1>Welcome to CryptoInvest</h1><p>This is a public design preview, not the live administrator login. No password, authenticator code or customer information is requested here.</p><button class="btn gold" style="width:100%;min-height:45px" data-action="enter">Enter design preview →</button><div style="margin-top:12px;text-align:center"><button class="btn ghost" data-action="identity">View CEO verification checkpoint</button></div><div class="login-foot">Live CEO sign-in remains on the protected application. This preview has no authenticated backend session and displays no private records.<br><br>Financial operations remain disabled.</div></section></main>'}
function render(){app.innerHTML=current==="login"?login():shell()}
function routeFromHash(){const id=location.hash.replace(/^#\/?/,"");if(id==="")current="login";else if(id==="login")current="login";else if(nav.some(n=>n.id===id))current=id;else current="dashboard";render()}
document.addEventListener("click",e=>{
 const route=e.target.closest("[data-route]");if(route){e.preventDefault();setRoute(route.dataset.route);return}
 const b=e.target.closest("[data-action]");if(!b)return;
 const a=b.dataset.action;
 if(a==="enter"){setRoute("dashboard");return}
if(a==="identity"){setRoute("ceo-verification");return}
if(a==="exit"){setRoute("login");return}
if(a==="login-return"){setRoute("login");return}
 if(a==="menu"){drawer=!drawer;render();return}
 if(a==="refresh"){toast("Backend connection not configured on this public preview. No records were requested or changed.");return}
 if(a==="notifications"){modal("Notifications","Notification history is available only through the authenticated backend. This preview does not send or retrieve messages.");return}
 if(a==="security-detail"){modal("Security requirements","CEO allowlist verification, MFA/AAL2, server-side authorization, row-level security and audit logging must all pass before protected data is displayed.");return}
 if(a==="support"){modal("Support information","A verified support contact and approved help documentation have not yet been configured for this preview.");return}
 if(a==="filter-report"){toast("Report filters are staged in this design preview. No backend report query is configured.");return}
});
document.addEventListener("input",e=>{if(e.target.id==="nav-search"){search=e.target.value;const y=window.scrollY;render();const input=document.getElementById("nav-search");input?.focus();input?.setSelectionRange(search.length,search.length);window.scrollTo(0,y)}});
window.addEventListener("hashchange",routeFromHash);
routeFromHash();
})();
</script>
