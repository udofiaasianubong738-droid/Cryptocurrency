name: CryptoInvest Admin CI

on:
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "nextjs/**"
      - ".github/workflows/cryptoinvest-admin-ci.yml"
  pull_request:
    paths:
      - "nextjs/**"
      - ".github/workflows/cryptoinvest-admin-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cryptoinvest-admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and OpenNext build (no deploy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://yniphceoofuwzpelpksd.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      FINANCIAL_OPERATIONS_ENABLED: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build Next.js application
        run: npm run build
      - name: Build Cloudflare OpenNext Worker
        run: npm run build:worker
