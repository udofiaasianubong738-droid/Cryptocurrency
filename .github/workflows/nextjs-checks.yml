name: Next.js security app checks

on:
  pull_request:
    paths:
      - "nextjs/**"
      - ".github/workflows/nextjs-checks.yml"
  push:
    branches:
      - "fix/mfa-totp-phase-1"
    paths:
      - "nextjs/**"
      - ".github/workflows/nextjs-checks.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate pinned dependency lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Upload dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-package-lock
          path: nextjs/package-lock.json
          if-no-files-found: error
