name: CryptoInvest application checks

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "nextjs/**"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/nextjs-ci.yml"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  push:
    branches:
      - "fix/production-safety-gates"
    paths:
      - "src/**"
      - "public/**"
      - "nextjs/**"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/nextjs-ci.yml"
      - ".github/workflows/deploy-cloudflare-worker.yml"

permissions:
  contents: read

concurrency:
  group: cryptoinvest-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vite-app:
    name: Vite app tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  nextjs-app:
    name: Next.js typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
