name: CryptoInvest Next.js checks

on:
  pull_request:
    paths:
      - "nextjs/**"
      - ".github/workflows/nextjs-ci.yml"
  push:
    branches:
      - "codex/cryptoinvest-nextjs-foundation"
    paths:
      - "nextjs/**"
      - ".github/workflows/nextjs-ci.yml"

permissions:
  contents: read

concurrency:
  group: nextjs-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
