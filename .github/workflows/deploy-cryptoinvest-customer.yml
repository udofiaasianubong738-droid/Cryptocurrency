name: Deploy CryptoInvest Customer Preview to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "nextjs/**"
      - ".github/workflows/deploy-cryptoinvest-customer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cryptocurrency-customer-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Type-check, build, and deploy customer preview Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    env:
      CLOUDFLARE_ACCOUNT_ID: '3b357abf0e4997c70044647171461ff7'
      FINANCIAL_OPERATIONS_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify deployment configuration
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test "$FINANCIAL_OPERATIONS_ENABLED" = "false" || { echo "Financial operations must remain disabled"; exit 1; }

      - name: Type-check
        run: npm run typecheck

      - name: Build OpenNext Worker
        run: npm run build:worker

      - name: Verify Worker bundle
        run: test -f .open-next/worker.js

      - name: Deploy customer preview Worker
        run: npx wrangler deploy --config wrangler.customer.jsonc
