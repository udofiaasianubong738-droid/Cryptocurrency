name: Deploy CryptoInvest Customer to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "nextjs/**"
      - ".github/workflows/deploy-cryptoinvest-customer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cryptoinvest-customer-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Type-check, build, and deploy customer Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    env:
      CLOUDFLARE_ACCOUNT_ID: '72b10490e65a914465cc281cb3cb7ed1'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://yniphceoofuwzpelpksd.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      FINANCIAL_OPERATIONS_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify required deployment configuration
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "Missing NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "Add SUPABASE_PUBLISHABLE_KEY as a GitHub Actions secret or variable"; exit 1; }
          test "$FINANCIAL_OPERATIONS_ENABLED" = "false" || { echo "Financial operations must remain disabled"; exit 1; }

      - name: Type-check
        run: npm run typecheck

      - name: Build OpenNext Worker
        run: npm run build:worker

      - name: Verify Worker bundle
        run: test -f .open-next/worker.js

      - name: Deploy customer Worker
        run: npx wrangler deploy --config wrangler.customer.jsonc

      # The Cloudflare account has Access default-deny enabled for every hostname.
      # Create narrowly-scoped public entry policies for these two Workers only.
      # The Next.js middleware still enforces customer login and CEO authorization + AAL2.
      - name: Allow public frontend entry points through Cloudflare Access
        env:
          ACCESS_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          configure_public_app() {
            local app_name="$1"
            local hostname="$2"
            local apps app_id created policies policy_id
            apps="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $ACCESS_API_TOKEN" \
              "$api/accounts/$ACCESS_ACCOUNT_ID/access/apps?name=$(printf '%s' "$app_name" | jq -sRr @uri)")"
            app_id="$(printf '%s' "$apps" | jq -r --arg host "$hostname" '.result[]? | select(.domain == $host) | .id' | head -n 1)"
            if [ -z "$app_id" ]; then
              created="$(curl --fail-with-body --silent --show-error \
                -X POST "$api/accounts/$ACCESS_ACCOUNT_ID/access/apps" \
                -H "Authorization: Bearer $ACCESS_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$(jq -n --arg name "$app_name" --arg domain "$hostname" '{type:"self_hosted",name:$name,domain:$domain}')")"
              app_id="$(printf '%s' "$created" | jq -r '.result.id // empty')"
            fi
            if [ -z "$app_id" ]; then
              echo "Could not create or locate Access application for $hostname"
              exit 1
            fi
            policies="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $ACCESS_API_TOKEN" \
              "$api/accounts/$ACCESS_ACCOUNT_ID/access/apps/$app_id/policies")"
            policy_id="$(printf '%s' "$policies" | jq -r '.result[]? | select(.name == "Public frontend entry; app authentication enforced" and .decision == "bypass") | .id' | head -n 1)"
            if [ -z "$policy_id" ]; then
              curl --fail-with-body --silent --show-error \
                -X POST "$api/accounts/$ACCESS_ACCOUNT_ID/access/apps/$app_id/policies" \
                -H "Authorization: Bearer $ACCESS_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data '{"name":"Public frontend entry; app authentication enforced","decision":"bypass","include":[{"everyone":{}}],"precedence":1}' \
                | jq -e '.success == true' >/dev/null
            fi
            echo "Configured public entry policy for $hostname; application-level authentication remains required."
          }
          configure_public_app "CryptoInvest Customer Frontend" "cryptocurrency.udofiaasianubong738.workers.dev"
          configure_public_app "CryptoInvest CEO Admin Frontend" "cryptocurrency-admin.udofiaasianubong738.workers.dev"
