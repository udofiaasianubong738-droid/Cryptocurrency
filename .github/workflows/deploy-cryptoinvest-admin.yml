name: Deploy CryptoInvest Admin to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "nextjs/**"
      - ".github/workflows/deploy-cryptoinvest-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cryptoinvest-admin-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Type-check, build, and deploy admin Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    env:
      CLOUDFLARE_ACCOUNT_ID: "72b10490e65a914465cc281cb3cb7ed1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://yniphceoofuwzpelpksd.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Build OpenNext Worker
        run: npm run build:worker

      - name: Verify production deployment configuration
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "Missing GitHub Actions variable NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "Missing GitHub Actions variable NEXT_PUBLIC_SUPABASE_ANON_KEY"; exit 1; }
          test -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" || { echo "Missing GitHub Actions variable NEXT_PUBLIC_TURNSTILE_SITE_KEY (must match the configured Supabase CAPTCHA provider)"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Deploy admin Worker
        run: npx wrangler deploy
