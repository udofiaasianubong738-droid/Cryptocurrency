name: Deploy CryptoInvest Admin to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "nextjs/**"
      - ".github/workflows/deploy-cryptoinvest-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cryptoinvest-admin-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Type-check, build, and deploy admin Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    env:
      CLOUDFLARE_ACCOUNT_ID: '72b10490e65a914465cc281cb3cb7ed1'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://yniphceoofuwzpelpksd.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      FINANCIAL_OPERATIONS_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify required deployment configuration
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "Missing NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "Add SUPABASE_PUBLISHABLE_KEY as a GitHub Actions secret or variable"; exit 1; }
          test "$FINANCIAL_OPERATIONS_ENABLED" = "false" || { echo "Financial operations must remain disabled"; exit 1; }

      - name: Type-check
        run: npm run typecheck

      - name: Build OpenNext Worker
        run: npm run build:worker

      - name: Verify Worker bundle
        run: test -f .open-next/worker.js

      - name: Deploy admin Worker
        run: npx wrangler deploy
