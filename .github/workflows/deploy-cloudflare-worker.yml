name: Build and deploy CryptoInvest to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_cloudflare:
        description: "Deploy to Cloudflare production (leave unchecked for build/test only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cryptoinvest-cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check Next.js app
        run: npm run typecheck
      - name: Build Cloudflare preview bundle
        run: npm run build:worker

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_cloudflare == true }}
    needs: build
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: nextjs
    steps:
      - name: Check required Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository/environment secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository/environment secret"; exit 1; }
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy to configured Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
