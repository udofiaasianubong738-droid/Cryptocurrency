name: Build and deploy CryptoInvest Admin preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "admin-preview/**"
      - ".github/workflows/deploy-github-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "admin-preview/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cryptoinvest-admin-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: node --check admin-preview/app.js
      - name: Validate preview structure and safety boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("admin-preview")
          required = ["index.html", "styles.css", "app.js", "logo.svg", "README.md"]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"Missing preview files: {missing}")
          js = (root / "app.js").read_text()
          html = (root / "index.html").read_text()
          for screen in ["welcome", "mfa", "overview", "customers", "investment-records", "performance", "documents", "notifications", "ai-operations", "security", "system-status", "audit", "profile", "settings", "support"]:
              if screen not in js:
                  raise SystemExit(f"Missing screen route: {screen}")
          for asset in ["./styles.css", "./app.js", "./logo.svg"]:
              if asset not in html:
                  raise SystemExit(f"Missing linked asset: {asset}")
          forbidden = ["service_role", "SUPABASE_SERVICE_ROLE_KEY", "password="]
          combined = js + html
          if any(value.lower() in combined.lower() for value in forbidden):
              raise SystemExit("A forbidden credential marker was found in the public preview.")
          print("Preview structure, navigation screens, linked assets and public-safety checks passed.")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload preview artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./admin-preview

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy CryptoInvest Admin preview
        id: deployment
        uses: actions/deploy-pages@v4
